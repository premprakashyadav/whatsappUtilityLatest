<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WhatsApp Message Utility</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; background:#f4f4f4; }
.container { max-width:500px;margin:auto;background:#fff;padding:20px }
button,input { padding:10px;margin-top:10px;width:100% }
.progress { height:20px;background:#ddd;border-radius:5px; margin-top:10px }
.bar { height:100%;width:0%;background:green;border-radius:5px }
.qr { text-align:center; margin-top:20px; }
img { max-width:100%; }
h2,h3 { margin-top:0 }
</style>
</head>

<body>
<div class="container">
<h2>WhatsApp Message Utility</h2>

<script>
const ADMIN_KEY = prompt('Enter Admin Key');
</script>

<!-- QR CODE SECTION -->
<div class="qr" id="qrSection">
  <h3>WhatsApp QR</h3>
  <p id="qrStatus">⏳ Checking WhatsApp status...</p>
  <img id="qrImg" style="display:none">
</div>

<hr>

<!-- IMAGE UPLOAD -->
<h3>Upload Image</h3>
<input type="file" id="imageInput" accept="image/*">
<button onclick="uploadImage()">Upload Image</button>
<p id="imageStatus" style="color:red">❌ Image not uploaded</p>
<img id="preview" style="display:none">

<hr>

<!-- EXCEL UPLOAD -->
<h3>Upload Excel</h3>
<form id="excelForm">
<input type="file" id="excelFile" required>
<button id="excelBtn" disabled>Submit Excel</button>
</form>

<div class="progress">
  <div class="bar" id="bar"></div>
</div>
<p id="progressText"></p>

</div>

<script>
const ADMIN_KEY = prompt('Enter Admin Key');

// ---------- QR CODE SECTION ----------
async function checkWhatsApp() {
  try {
    const res = await fetch('/qr');
    const text = await res.text();
    if (text.includes('already authenticated')) {
      qrStatus.textContent = '✅ WhatsApp connected';
      qrImg.style.display = 'none';
      excelBtn.disabled = true; // Enable only after image is uploaded
    } else if (text.includes('QR not ready')) {
      qrStatus.textContent = '⏳ QR not ready, refresh in 5 sec';
      qrImg.style.display = 'none';
      setTimeout(checkWhatsApp, 5000);
    } else {
      qrStatus.textContent = '📲 Scan this QR with WhatsApp';
      qrImg.src = text.match(/src="([^"]+)"/)[1];
      qrImg.style.display = 'block';
      setTimeout(checkWhatsApp, 5000);
    }
  } catch (err) {
    qrStatus.textContent = '❌ Error fetching QR';
    console.error(err);
  }
}

// ---------- IMAGE UPLOAD ----------
async function checkImageStatus() {
  const res = await fetch('/image-status');
  const data = await res.json();
  if (data.uploaded) {
    imageStatus.textContent = '✅ Image uploaded';
    imageStatus.style.color = 'green';
    excelBtn.disabled = false;
    // Update preview to use the new uploads folder
    preview.src = '/uploads/vishwas-slip.jpg?' + Date.now();
    preview.style.display = 'block';
  } else {
    excelBtn.disabled = true;
  }
}

async function uploadImage() {
  const f = imageInput.files[0];
  if (!f) return alert('Select image');

  const fd = new FormData();
  fd.append('image', f);

  await fetch('/upload-image', {
    method: 'POST',
    headers: { 'x-admin-key': ADMIN_KEY },
    body: fd
  });

  checkImageStatus();
}

// ---------- EXCEL UPLOAD ----------
excelForm.addEventListener('submit', async e => {
  e.preventDefault();
  const f = excelFile.files[0];
  if (!f) return;

  const fd = new FormData();
  fd.append('file', f);

  const res = await fetch('/upload', {
    method: 'POST',
    headers: { 'x-admin-key': ADMIN_KEY },
    body: fd
  });
  const data = await res.json();
  if (data.success) pollProgress();
});

// ---------- PROGRESS BAR ----------
async function pollProgress() {
  const res = await fetch('/progress');
  const d = await res.json();
  if (!d.total) return;

  const p = Math.floor((d.processed / d.total) * 100);
  bar.style.width = p + '%';
  progressText.textContent = `Sent ${d.processed} / ${d.total}`;

  if (d.processed < d.total) setTimeout(pollProgress, 3000);
}

// INITIALIZE
checkWhatsApp();
checkImageStatus();
</script>

</body>
</html>
